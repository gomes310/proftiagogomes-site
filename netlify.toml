[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

# /#questoes continua sendo a inscrição por e-mail na página inicial.
# O banco de questões tem página própria em /questoes/ (gerada por scripts/build.mjs).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
